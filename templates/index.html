<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Pensieve</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="stars"></div>

  <header>
    <h1>The Pensieve</h1>
    <p class="subtitle">A vessel for memories — pour them in, revisit them whenever you wish.</p>
  </header>

  <main>
    <section class="basin">
      <div class="swirl"></div>
      <form action="{{ url_for('add') }}" method="post" class="pour-form">
        <textarea name="text" placeholder="Pour a memory into the basin..." required></textarea>
        <button type="submit">Release</button>
      </form>
    </section>

    <section class="memories">
      {% if memories %}
        {% for m in memories %}
          <article class="memory">
            <div class="memory-meta">#{{ m.id }} · {{ m.timestamp | pretty_date }}</div>
            <div class="memory-text">{{ m.text }}</div>
          </article>
        {% endfor %}
      {% else %}
        <p class="empty">The basin is empty. Your first memory awaits.</p>
      {% endif %}
    </section>
  </main>
</body>
</html>
